version: "3.9"

# ─── Rastera Engine — Docker Compose ─────────────────────────────────────────
# Production: DB port is NOT mapped to host. API exposed on 8080 (Caddy proxies it).
# Local dev:  Uncomment the db ports block below to connect with pgAdmin/psql.

services:

  # ── PostGIS Database ──────────────────────────────────────────────────────
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: rastera
      POSTGRES_USER: rastera
      POSTGRES_PASSWORD: ${DB_PASSWORD:-CHANGE_ME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Auto-run schema + seed on first start
      - ./app/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./app/sql/seed_demo.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    # ── PRODUCTION: do NOT expose 5432 externally ──
    # ports:
    #   - "127.0.0.1:5432:5432"   # uncomment for local dev only
    networks:
      - rastera_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rastera -d rastera"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── FastAPI Application ───────────────────────────────────────────────────
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://rastera:${DB_PASSWORD:-CHANGE_ME}@db:5432/rastera
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"   # Caddy reverse-proxies this on the VPS
    networks:
      - rastera_net
    volumes:
      - ./templates:/app/templates:ro  # hot-reload templates without rebuild
    restart: unless-stopped

  # ── Background Worker ─────────────────────────────────────────────────────
  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://rastera:${DB_PASSWORD:-CHANGE_ME}@db:5432/rastera
    command: python -m worker.worker
    depends_on:
      db:
        condition: service_healthy
    networks:
      - rastera_net
    restart: unless-stopped

networks:
  rastera_net:
    driver: bridge

volumes:
  postgres_data:
